<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OMO DRIVE</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Arial;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border-radius:10px;
    z-index:10;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<div id="hud">
    <h2>OMO DRIVE</h2>

    Speed:
    <span id="speed">0</span>
    MPH
    <br>

    RPM:
    <span id="rpm">800</span>
    <br>

    Distance:
    <span id="distance">0</span>
    mi
    <br>

    Fuel:
    <span id="fuel">100</span>%
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let speed=0;
let maxSpeed=180;
let distance=0;
let fuel=100;

let roadOffset=0;

let car={
    x:canvas.width/2,
    y:canvas.height-180,
    w:70,
    h:120
};

let keys={};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function update(){

    if(keys["ArrowUp"] || keys["w"]){

        speed+=0.5;
    }

    if(keys["ArrowDown"] || keys["s"]){

        speed-=1;
    }

    if(keys["ArrowLeft"] || keys["a"]){

        car.x-=6;
    }

    if(keys["ArrowRight"] || keys["d"]){

        car.x+=6;
    }

    speed=Math.max(0,Math.min(maxSpeed,speed));

    roadOffset += speed*0.4;

    distance += speed*0.0004;

    fuel -= speed*0.00003;

    if(fuel<0){
        fuel=0;
        speed=0;
    }

    document.getElementById("speed").innerText=
        Math.floor(speed);

    document.getElementById("rpm").innerText=
        Math.floor(800 + speed*35);

    document.getElementById("distance").innerText=
        distance.toFixed(2);

    document.getElementById("fuel").innerText=
        fuel.toFixed(1);
}

function drawSky(){

    let g=ctx.createLinearGradient(0,0,0,canvas.height);

    g.addColorStop(0,"#3ea8ff");
    g.addColorStop(1,"#8ed0ff");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawScenery(){

    ctx.fillStyle="#3cb043";

    ctx.fillRect(0,canvas.height-250,
        canvas.width,250);

    for(let i=0;i<25;i++){

        let y=((i*200)+(roadOffset%200));

        ctx.fillStyle="#6b4f2a";

        ctx.fillRect(
            120,
            canvas.height-y,
            10,
            60
        );

        ctx.fillRect(
            canvas.width-130,
            canvas.height-y,
            10,
            60
        );

        ctx.beginPath();

        ctx.fillStyle="green";

        ctx.arc(
            125,
            canvas.height-y,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            canvas.width-125,
            canvas.height-y,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function drawRoad(){

    let roadWidth=400;

    let roadX=(canvas.width-roadWidth)/2;

    ctx.fillStyle="#444";

    ctx.fillRect(
        roadX,
        0,
        roadWidth,
        canvas.height
    );

    ctx.strokeStyle="white";
    ctx.lineWidth=6;

    for(let y=-200;y<canvas.height+200;y+=80){

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2,
            y+(roadOffset%80)
        );

        ctx.lineTo(
            canvas.width/2,
            y+40+(roadOffset%80)
        );

        ctx.stroke();
    }
}

function drawCar(){

    let x=car.x;
    let y=car.y;

    ctx.fillStyle="#ff2222";

    ctx.fillRect(
        x-car.w/2,
        y-car.h/2,
        car.w,
        car.h
    );

    ctx.fillStyle="#87ceeb";

    ctx.fillRect(
        x-25,
        y-40,
        50,
        35
    );

    ctx.fillStyle="black";

    ctx.beginPath();
    ctx.arc(x-30,y-45,10,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x+30,y-45,10,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x-30,y+45,10,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x+30,y+45,10,0,Math.PI*2);
    ctx.fill();
}

function draw(){

    drawSky();
    drawScenery();
    drawRoad();
    drawCar();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
